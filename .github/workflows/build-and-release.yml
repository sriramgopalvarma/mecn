name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Node.js server
        run: node --check server.js

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore .NET
        run: dotnet restore MeconApp.csproj --runtime win-x64

      - name: Publish .NET for Windows x64
        run: dotnet publish MeconApp.csproj --configuration Release --runtime win-x64 --self-contained true --output publish/backend --no-restore

      - name: Create deployment package
        run: |
          mkdir -p package/backend
          cp -r publish/backend/* package/backend/
          cp server.js package.json package/

      - name: Create ZIP
        run: |
          cd package
          zip -r ../mecon-windows-x64.zip .

      - name: Generate SHA256
        run: sha256sum mecon-windows-x64.zip > mecon-windows-x64.zip.sha256

      - name: Generate version
        id: version
        run: echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            mecon-windows-x64.zip
            mecon-windows-x64.zip.sha256
